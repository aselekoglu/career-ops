name: Career Ops CV render
run-name: Career Ops CV ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Authenticated durable CV run identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: career-ops-cv-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CV_RUN_ID: ${{ inputs.run_id }}
      CAREER_OPS_SCAN_WORKER_SECRET: ${{ secrets.CAREER_OPS_SCAN_WORKER_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # GitHub-hosted Ubuntu runners already provide Chromium's core system libraries.
      # Avoid apt install --with-deps on every CV render (8+ minutes on Ubuntu 26.04).
      - name: Cache Chromium headless shell
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-cv-chromium-shell-${{ hashFiles('package.json') }}-v1
      - name: Install renderer dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install chromium --only-shell
      - name: Test CV worker diagnostics
        run: node --test tests/cloud-cv-worker-diagnostics.test.mjs
      # Test the actual GitHub runner's browser libraries before touching
      # private CV data; this distinguishes a missing library from a bad CV.
      - name: Smoke test headless Chromium on runner
        run: node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch({ headless: true }); const page = await browser.newPage(); await page.setContent('<h1>CV renderer smoke</h1>'); await page.pdf(); await browser.close();"
      - name: Render tailored CV
        run: node web/scripts/cloud-cv-worker.mjs
      - name: Persist worker failure
        if: failure()
        run: node web/scripts/cloud-cv-worker.mjs --fail
