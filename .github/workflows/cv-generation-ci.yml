name: CV Generation CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/career-ops-cv-render.yml"
      - ".github/workflows/cv-generation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node --test tests/lib/hosted-ai.test.mjs
      - run: node --check src/lib/cloud-cv-runs.mjs
      - run: node --check scripts/cloud-cv-worker.mjs
      - run: npx tsc --noEmit
      - run: npm run build
